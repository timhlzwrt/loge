name: loge

options:
  bundleIdPrefix: li.tjh
  deploymentTarget:
    iOS: "26.0"
    tvOS: "26.0"
    macOS: "26.0"

packages:
  LogeCore:
    path: Core
  # MPVKit with a patched Libmpv; see Vendor/MPVKit/README.md.
  MPVKit:
    path: Vendor/MPVKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

targets:
  loge:
    type: application
    supportedDestinations: [iOS, tvOS, macOS]
    sources:
      - path: App
      - path: Vendor/Sparkle-LICENSE.txt
        buildPhase: resources
        destinationFilters: [macOS]
    # Merged with the generated Info.plist; holds keys that have no build setting.
    info:
      path: App/Info.plist
      properties:
        # Picture in Picture keeps playing once the app is in the background.
        UIBackgroundModes: [audio]
        # Read by Sparkle on macOS; the other platforms do not link the updater.
        SUFeedURL: https://tjh.li/loge/appcast.xml
        SUPublicEDKey: soQg67Hcc4FdzFXtjN/k8OKntRJSs7SACKnoK/xh7Oc=
        SUVerifyUpdateBeforeExtraction: true
        SURequireSignedFeed: true
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    dependencies:
      - package: LogeCore
      - package: MPVKit
        product: MPVKit
      - package: Sparkle
        destinationFilters: [macOS]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Bundle ID stays li.tjh.MediaApp so saved addons and library carry over.
        PRODUCT_BUNDLE_IDENTIFIER: li.tjh.MediaApp
        PRODUCT_NAME: loge
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # Landscape for full-screen video; portrait for browsing.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # tvOS icons are layered for the parallax effect and live in a brand-assets set.
        ASSETCATALOG_COMPILER_APPICON_NAME[sdk=appletv*]: App Icon & Top Shelf Image
        # Ad-hoc signing lets the Mac build run without a developer account; Config/Signing.xcconfig
        # explains how to sign with a certificate instead.
        CODE_SIGN_IDENTITY[sdk=macosx*]: "$(LOGE_MAC_SIGNING_IDENTITY:default=-)"
        LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]: "$(inherited) @executable_path/../Frameworks"
        # The distributed Mac build is for Apple silicon; an Intel slice doubled its build time.
        ARCHS[sdk=macosx*]: arm64
        # The commit stamp below reads the repository, outside what a sandboxed script may.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Settings > About shows which commit a build is, to compare with GitHub; the build
    # number is the commit count.
    postBuildScripts:
      - name: Stamp commit
        basedOnDependencyAnalysis: false
        script: |
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          git() { /usr/bin/git -C "$SRCROOT" "$@"; }
          commit=$(git rev-parse HEAD 2>/dev/null) || exit 0
          # The commit count as the build number, so each build of main counts up and
          # SideStore offers it as an update. CI needs the full history for this.
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $(git rev-list --count HEAD)" "$plist"
          modified=$([ -n "$(git status --porcelain --untracked-files=no)" ] && echo true || echo false)
          for entry in "LogeCommit string $commit" \
                       "LogeCommitDate string $(git log -1 --format=%cI)" \
                       "LogeBranch string $(git rev-parse --abbrev-ref HEAD)" \
                       "LogeModified bool $modified"; do
            set -- $entry
            /usr/libexec/PlistBuddy -c "Delete :$1" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :$1 $2 $3" "$plist"
          done
    scheme:
      testTargets:
        - logeUITests

  # Manual UI checks: a remote driver for the Apple TV simulator and on-demand player tests.
  logeUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, tvOS]
    sources: [UITests]
    dependencies:
      - target: loge
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
