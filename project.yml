name: MediaApp

options:
  bundleIdPrefix: li.tjh
  deploymentTarget:
    iOS: "27.0"
    tvOS: "27.0"
    macOS: "27.0"

packages:
  MediaCore:
    path: Core
  MPVKit:
    url: https://github.com/mpvkit/MPVKit
    exactVersion: 1.1.0-n9.0.2

targets:
  MediaApp:
    type: application
    supportedDestinations: [iOS, tvOS, macOS]
    sources: [App]
    dependencies:
      - package: MediaCore
      - package: MPVKit
        product: MPVKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MediaApp
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # Landscape for full-screen video; portrait for browsing.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # tvOS icons are layered for the parallax effect and live in a brand-assets set.
        ASSETCATALOG_COMPILER_APPICON_NAME[sdk=appletv*]: App Icon & Top Shelf Image
        # Ad-hoc signing lets the Mac build run locally without a developer account
        CODE_SIGN_IDENTITY[sdk=macosx*]: "-"
    scheme:
      testTargets:
        - MediaAppUITests

  # Manual UI checks: a remote driver for the Apple TV simulator and on-demand player tests.
  MediaAppUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, tvOS]
    sources: [UITests]
    dependencies:
      - target: MediaApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
