# Run from the deployment directory after bootstrap.py: docker compose up -d --build
name: loge-sync
services:
  couchdb:
    image: couchdb:3.5.3@sha256:bed314d10cdf58c0fff63352db4c3f168df58a185a773c0e2295105375c5ef10
    restart: unless-stopped
    user: "5984:5984"
    environment:
      COUCHDB_ERLANG_FLAGS: "+S 1:1 +A 4"
    volumes:
      - ./data:/opt/couchdb/data
      - ./local.ini:/opt/couchdb/etc/local.d/10-loge.ini:ro
      # Generated by bootstrap.py, readable by uid 5984; contains a hashed admin credential.
      - ./secrets/admin.ini:/opt/couchdb/etc/local.d/99-admin.ini:ro
    ports: ["127.0.0.1:5984:5984"]
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 256
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  gateway:
    image: loge-sync-gateway:local
    pull_policy: never
    build: .
    restart: unless-stopped
    user: "5984:5984"
    environment:
      SYNC_DATABASE_URL: http://couchdb:5984/loge
      SYNC_DATABASE_CREDENTIAL_FILE: /run/secrets/gateway.json
    volumes:
      - ./secrets/gateway.json:/run/secrets/gateway.json:ro
    ports: ["127.0.0.1:5985:8080"]
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 128
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  administration:
    image: loge-sync-gateway:local
    pull_policy: never
    restart: unless-stopped
    user: "5984:5984"
    environment:
      SYNC_MODE: admin
      SYNC_ADMIN_ORIGIN: ${SYNC_ADMIN_ORIGIN:-}
      SYNC_DATABASE_URL: http://couchdb:5984/loge
      SYNC_DATABASE_CREDENTIAL_FILE: /run/secrets/gateway.json
      SYNC_ADMIN_SECRET_FILE: /run/secrets/admin-token
      SYNC_PUBLIC_ENDPOINT: ${SYNC_PUBLIC_ENDPOINT:?Set the public HTTPS endpoint ending in /v2}
    volumes:
      - ./secrets/gateway.json:/run/secrets/gateway.json:ro
      - ./secrets/gateway-admin-token:/run/secrets/admin-token:ro
    ports: ["127.0.0.1:5986:8080"]
    depends_on: [gateway]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 128
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

networks:
  default:
    external: true
    name: loge-sync_default
