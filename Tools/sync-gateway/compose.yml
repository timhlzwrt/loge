# Add to the existing backend with: docker compose -f docker-compose.yml -f gateway/compose.yml up -d --build
services:
  gateway:
    image: loge-sync-gateway:local
    build: ./gateway
    restart: unless-stopped
    user: "5984:5984"
    environment:
      SYNC_DATABASE_URL: http://couchdb:5984/loge
      SYNC_DATABASE_CREDENTIAL_FILE: /run/secrets/gateway.json
    volumes:
      - ./secrets/gateway.json:/run/secrets/gateway.json:ro
    ports: ["127.0.0.1:5985:8080"]
    depends_on: [couchdb]
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 128
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  administration:
    image: loge-sync-gateway:local
    restart: unless-stopped
    user: "5984:5984"
    environment:
      SYNC_MODE: admin
      SYNC_DATABASE_URL: http://couchdb:5984/loge
      SYNC_DATABASE_CREDENTIAL_FILE: /run/secrets/gateway.json
      SYNC_ADMIN_SECRET_FILE: /run/secrets/admin-token
      SYNC_PUBLIC_ENDPOINT: ${SYNC_PUBLIC_ENDPOINT:?Set the public HTTPS endpoint ending in /v2}
    volumes:
      - ./secrets/gateway.json:/run/secrets/gateway.json:ro
      - ./secrets/gateway-admin-token:/run/secrets/admin-token:ro
    ports: ["127.0.0.1:5986:8080"]
    depends_on: [gateway]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 128
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
