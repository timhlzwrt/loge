# Single-user encrypted configuration service; see docs/CONFIGURATION_SYNC.md.
name: loge-sync
services:
  couchdb:
    image: couchdb:3.5.3@sha256:bed314d10cdf58c0fff63352db4c3f168df58a185a773c0e2295105375c5ef10
    restart: unless-stopped
    user: "5984:5984"
    environment:
      COUCHDB_ERLANG_FLAGS: "+S 1:1 +A 4"
    volumes:
      - ./data:/opt/couchdb/data
      - ./local.ini:/opt/couchdb/etc/local.d/10-loge.ini:ro
      # Generated on the server, readable by uid 5984; contains a hashed admin credential.
      - ./secrets/admin.ini:/opt/couchdb/etc/local.d/99-admin.ini:ro
    ports: ["127.0.0.1:5984:5984"]
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 256
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
