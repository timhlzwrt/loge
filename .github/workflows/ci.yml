name: CI

# Pull requests only: the merge result is what lands, and the Release workflow tests and builds
# main itself. Running this on main too would put eight macOS jobs against the five a free
# account runs at once, so releases waited in the queue.
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - docs/**
      - web/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
  sync-gateway:
    name: Sync gateway tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -r Tools/sync-gateway/requirements-dev.txt
      - run: python -m unittest discover -s Tools/sync-gateway -p 'test_*.py'

  core:
    name: Core tests
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Release publishing regressions
        run: python3 -B -m unittest discover -s Tools -p test_publish_release.py
      - run: swift test
        working-directory: Core

  build:
    name: Build ${{ matrix.platform }}
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            destination: generic/platform=iOS Simulator
          - platform: tvOS
            destination: generic/platform=tvOS Simulator
          - platform: macOS
            destination: platform=macOS
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - run: xcodegen generate
      # MPVKit's binary frameworks are large; Release saves them on main, where every
      # pull request can restore them.
      - uses: actions/cache@v6
        with:
          path: .build/xcode/SourcePackages
          key: spm-${{ hashFiles('project.yml', 'Vendor/MPVKit/Package.swift') }}
      # Warnings fail the build, matching the "no warnings" rule in CLAUDE.md.
      - run: >
          xcodebuild build
          -project loge.xcodeproj
          -scheme loge
          -destination '${{ matrix.destination }}'
          -derivedDataPath .build/xcode
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
