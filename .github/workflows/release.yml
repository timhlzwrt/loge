name: Release

# Every push to main becomes a release with unsigned .ipa files and a self-signed Mac .dmg,
# and the SideStore source on GitHub Pages lists it, so SideStore offers it as an update.
# SideStore signs the app on the phone with the user's own free Apple ID; the tvOS .ipa is for
# Sideloadly and the like.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, in push order, so build numbers and the source stay consistent.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: xcode-27
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}source.json
    steps:
      - uses: actions/checkout@v4
        with:
          # The build number is the commit count, and release notes go back to the last build.
          fetch-depth: 0
      - name: Check Mac update signing is configured
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY" || { echo 'Set the SPARKLE_PRIVATE_KEY repository secret before releasing.' >&2; exit 1; }
      # The Mac app is signed with loge's own self-signed certificate, so the Keychain knows each
      # update as the same app; see docs/MAC_UPDATES.md.
      - name: Load the Mac signing certificate
        env:
          MAC_SIGNING_CERTIFICATE: ${{ secrets.MAC_SIGNING_CERTIFICATE }}
          MAC_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MAC_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$MAC_SIGNING_CERTIFICATE" -a -n "$MAC_SIGNING_CERTIFICATE_PASSWORD" || {
            echo 'Set the MAC_SIGNING_CERTIFICATE and MAC_SIGNING_CERTIFICATE_PASSWORD repository secrets before releasing.' >&2; exit 1; }
          keychain="$RUNNER_TEMP/loge-signing.keychain-db"
          password=$(openssl rand -base64 24)
          printf '%s' "$MAC_SIGNING_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/loge-signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/loge-signing.p12" -k "$keychain" \
            -P "$MAC_SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/loge-signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          echo "MAC_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - run: brew install xcodegen
      - uses: actions/cache@v4
        with:
          path: .build/xcode/SourcePackages
          key: spm-release-${{ hashFiles('project.yml', 'Vendor/MPVKit/Package.swift') }}
      - run: Tools/build-ipa.sh iOS tvOS
      - run: Tools/build-dmg.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          plist=.build/xcode/Build/Products/Release-iphoneos/loge.app/Info.plist
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$plist")
          build=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$plist")
          # A failed publish can leave its tag behind. Only published releases
          # belong in the changelog baseline, excluding this build on a rerun.
          previous=$(gh release list --exclude-drafts --limit 100 --json tagName \
            --jq "[.[] | select(.tagName != \"build-$build\")][0].tagName // empty")
          range=${previous:+$previous..}HEAD
          git log --no-merges --format='- %s' -n 20 "$range" > notes.md
          Tools/prepare-mac-update.sh "build-$build" notes.md
          Tools/publish-release.sh "build-$build" "$version ($build)" "$GITHUB_SHA" notes.md \
            .build/ipa/loge-iOS.ipa .build/ipa/loge-tvOS.ipa .build/dmg/loge-macOS.dmg .build/mac-update/appcast.xml
          # Use immutable published bytes; rerunning an older release must not roll back the feed.
          mkdir -p site
          gh release download --pattern appcast.xml --dir site --clobber

      - name: Write the SideStore source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          cp App/Assets.xcassets/AppIcon.appiconset/icon-1024.png site/icon.png
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --slurp | jq 'add' > releases.json
          # Pages is served on the account's custom domain; github.io redirects there over plain HTTP.
          python3 Tools/sidestore-source.py releases.json https://tjh.li/loge > site/source.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: pages
        uses: actions/deploy-pages@v4
      - name: Remove the signing keychain
        if: always() && env.MAC_SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$MAC_SIGNING_KEYCHAIN"
