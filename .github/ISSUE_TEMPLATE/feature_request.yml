name: Feature proposal
description: Describe a concrete problem and a focused improvement.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: Read the roadmap first. Downloads, torrent playback and a default hosted sync backend are out of scope. Do not share private configuration or credentials.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe your current task and what gets in the way, including affected platforms.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the smallest useful change and any alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: How would we know it works?
      description: Useful examples, edge cases, accessibility needs or hardware you could help test.
