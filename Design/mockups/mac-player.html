<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mac Player</title>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.r{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;color:#f5f5f7;background:#000;position:relative;overflow:hidden;-webkit-font-smoothing:antialiased}
.r *{box-sizing:border-box}
.sec{color:rgba(235,235,245,.64)}
.ter{color:rgba(235,235,245,.5)}
.fill{position:absolute;inset:0}
.ib{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:0;border-radius:999px;background:none;color:#f5f5f7;flex:none}
.a-sh3{background:radial-gradient(90% 80% at 50% 45%,#8a8a8a 0,#333 50%,#0b0b0b 100%)}
.a-sh4{background:radial-gradient(120% 100% at 20% 20%,#bbbbbb 0,#404040 55%,#111 100%)}
</style>
</helmet>
<div class="r" style="width: 1280px; height: 800px; border-radius: 16px">
  <div class="fill a-sh3" aria-hidden="true"></div>
  <div class="fill" style="background: linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 14%, rgba(0,0,0,0) 70%, rgba(0,0,0,.6) 100%)" aria-hidden="true"></div>

  <header style="position: absolute; left: 0; right: 0; top: 0; height: 44px; display: flex; align-items: center; justify-content: center">
    <div style="position: absolute; left: 16px; display: flex; gap: 8px" aria-hidden="true">
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #ff5f57"></span>
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #febc2e"></span>
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #28c840"></span>
    </div>
    <span style="font-size: 13px; font-weight: 600">Sherlock Holmes <span class="sec" style="font-weight: 400">· S1 · E6</span></span>
  </header>

  <aside style="position: absolute; right: 24px; bottom: 104px; width: 360px; padding: 12px; border-radius: 22px; background: rgba(60,60,66,.5); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%); box-shadow: inset 0 1px 0 rgba(255,255,255,.2), inset 0 0 0 .5px rgba(255,255,255,.14), 0 16px 40px rgba(0,0,0,.4); display: flex; gap: 12px" aria-label="Up next">
    <div class="a-sh4" style="width: 128px; height: 72px; border-radius: 8px; flex: none" aria-hidden="true"></div>
    <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1">
      <span class="ter" style="font-size: 11px; font-weight: 600">Up Next · in 8 s</span>
      <span style="font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">7 · The Case of the Winged Scarab</span>
      <div style="display: flex; gap: 8px; margin-top: 6px">
        <button type="button" style="height: 28px; padding: 0 14px; border: 0; border-radius: 999px; background: #f5f5f7; color: #141417; font: inherit; font-size: 12px; font-weight: 600">Play Now</button>
        <button type="button" style="height: 28px; padding: 0 14px; border: 0; border-radius: 999px; background: rgba(255,255,255,.14); color: #f5f5f7; font: inherit; font-size: 12px; font-weight: 600">Cancel</button>
      </div>
    </div>
  </aside>

  <section style="position: absolute; left: 50%; bottom: 24px; width: 720px; margin-left: -360px; height: 56px; padding: 0 12px; border-radius: 999px; background: rgba(60,60,66,.5); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%); box-shadow: inset 0 1px 0 rgba(255,255,255,.2), inset 0 0 0 .5px rgba(255,255,255,.14); display: flex; align-items: center; gap: 6px" aria-label="Playback controls">
    <button type="button" class="ib" aria-label="Back 10 seconds"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6"></path><path d="M4 4v4h4"></path></svg></button>
    <button type="button" class="ib" aria-label="Pause"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></button>
    <button type="button" class="ib" aria-label="Forward 10 seconds"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"></path><path d="M20 4v4h-4"></path></svg></button>
    <span class="sec" style="font-size: 12px; font-variant-numeric: tabular-nums; width: 44px; text-align: right">25:28</span>
    <div style="flex: 1; position: relative; height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); margin: 0 8px" role="slider" aria-label="Playback position" aria-valuenow="97" aria-valuemin="0" aria-valuemax="100">
      <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 97%; border-radius: 2px; background: #f5f5f7"></div>
    </div>
    <span class="sec" style="font-size: 12px; font-variant-numeric: tabular-nums; width: 40px">−0:47</span>
    <button type="button" class="ib" aria-label="Subtitles"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M7 12h4M13 12h4M7 15h7"></path></svg></button>
    <button type="button" class="ib" aria-label="Audio"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"></path></svg></button>
    <button type="button" class="ib" aria-label="Picture in Picture"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><rect x="12" y="12" width="6" height="4" rx="1" fill="currentColor"></rect></svg></button>
    <button type="button" class="ib" aria-label="Full screen"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg></button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
