<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tvOS Sources</title>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.r{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;color:#fff;background:#141417;position:relative;overflow:hidden;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
.r *{box-sizing:border-box}
.sec{color:rgba(235,235,245,.6)}
.fill{position:absolute;inset:0}
.grp{margin:0 0 6px 24px;font-size:15px;font-weight:600;color:rgba(235,235,245,.6)}
.src{display:flex;align-items:center;gap:18px;width:100%;height:66px;padding:0 24px;border:0;border-radius:18px;background:none;color:#fff;font:inherit;text-align:left}
.src .t{display:block;font-size:18px;font-weight:600}
.src .m{display:block;font-size:14px;color:rgba(235,235,245,.6);margin-top:2px}
.src .z{margin-left:auto;font-size:16px;font-variant-numeric:tabular-nums;color:rgba(235,235,245,.6)}
.src.focus{background:#fff;color:#000;transform:scale(1.03);box-shadow:0 16px 36px rgba(0,0,0,.5)}
.src.focus .m,.src.focus .z{color:rgba(0,0,0,.6)}
.src.cold > span{opacity:.45}
.chk{width:20px;flex:none}
.a-tos{background:radial-gradient(90% 90% at 25% 40%,#6d93b3 0,#2a4157 45%,#0b1118 100%)}
</style>
</helmet>
<div class="r" style="width: 1280px; height: 720px">
  <div class="fill a-tos" aria-hidden="true"></div>
  <div class="fill" style="background: linear-gradient(90deg, rgba(20,20,23,.3) 0%, rgba(20,20,23,.78) 42%, rgba(20,20,23,.94) 58%)" aria-hidden="true"></div>

  <header style="position: absolute; left: 60px; bottom: 72px; width: 440px; display: flex; flex-direction: column; gap: 10px">
    <h1 style="margin: 0; font-size: 46px; font-weight: 300; letter-spacing: .22em; line-height: 1.05">TEARS OF STEEL</h1>
    <p class="sec" style="margin: 0; font-size: 15px; font-weight: 500">Sci-Fi · 2012 · 12 min</p>
  </header>

  <main style="position: absolute; left: 600px; right: 60px; top: 72px; display: flex; flex-direction: column; gap: 22px" aria-label="Sources">
    <section>
      <h2 class="grp">4K</h2>
      <button type="button" class="src focus">
        <span><span class="t">Remux</span><span class="m">HEVC · HDR10 · TrueHD Atmos 7.1</span></span>
        <span class="z">7.9 GB</span>
        <svg class="chk" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Last played"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
      </button>
      <button type="button" class="src">
        <span><span class="t">WEB-DL</span><span class="m">HEVC · HDR10 · DD+ 5.1</span></span>
        <span class="z">2.1 GB</span><span class="chk"></span>
      </button>
    </section>
    <section>
      <h2 class="grp">1080p</h2>
      <button type="button" class="src">
        <span><span class="t">BluRay</span><span class="m">AVC · DTS 5.1</span></span>
        <span class="z">1.4 GB</span><span class="chk"></span>
      </button>
      <button type="button" class="src cold">
        <span><span class="t">WEB-DL</span><span class="m">HEVC · DD+ 5.1 · not cached</span></span>
        <span class="z">640 MB</span><span class="chk"></span>
      </button>
    </section>
    <section>
      <h2 class="grp">720p</h2>
      <button type="button" class="src">
        <span><span class="t">WEB</span><span class="m">AVC · AAC 2.0</span></span>
        <span class="z">310 MB</span><span class="chk"></span>
      </button>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
