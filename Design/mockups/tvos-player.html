<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tvOS Player</title>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.r{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;color:#fff;background:#000;position:relative;overflow:hidden;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
.r *{box-sizing:border-box}
.sec{color:rgba(235,235,245,.6)}
.fill{position:absolute;inset:0}
.glass{background:rgba(60,60,66,.55);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 0 .5px rgba(255,255,255,.14)}
.tabs button{height:40px;padding:0 22px;border:0;border-radius:999px;background:none;color:rgba(255,255,255,.75);font:inherit;font-size:16px;font-weight:600}
.tabs button.on{background:#fff;color:#000}
.panel h3{margin:0 0 8px;padding-left:14px;font-size:13px;font-weight:600;color:rgba(235,235,245,.6)}
.opt{display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 14px;border:0;border-radius:12px;background:none;color:#fff;font:inherit;font-size:16px;text-align:left}
.opt svg{width:16px;flex:none}
.opt.focus{background:rgba(255,255,255,.18);font-weight:600}
.step{display:flex;align-items:center;justify-content:space-between;height:42px;padding:0 5px;border-radius:999px;background:rgba(255,255,255,.1);font-size:15px;font-variant-numeric:tabular-nums}
.step button{width:32px;height:32px;border:0;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font:inherit;font-size:18px;line-height:1}
.a-tos{background:radial-gradient(90% 80% at 35% 45%,#6d93b3 0,#2a4157 45%,#0b1118 100%)}
</style>
</helmet>
<div class="r" style="width: 1280px; height: 720px">
  <div class="fill a-tos" aria-hidden="true"></div>
  <div class="fill" style="background: linear-gradient(180deg, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 40%, rgba(0,0,0,0) 60%, rgba(0,0,0,.7) 100%)" aria-hidden="true"></div>

  <div class="tabs glass" role="tablist" aria-label="Player" style="position: absolute; left: 50%; top: 34px; transform: translateX(-50%); display: flex; gap: 4px; padding: 5px; border-radius: 999px">
    <button type="button" role="tab" aria-selected="false">Info</button>
    <button type="button" role="tab" aria-selected="true" class="on">Subtitles</button>
    <button type="button" role="tab" aria-selected="false">Audio</button>
  </div>

  <section class="panel glass" role="tabpanel" aria-label="Subtitles" style="position: absolute; left: 50%; top: 98px; width: 560px; margin-left: -280px; padding: 18px 14px; border-radius: 28px; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px">
    <div>
      <h3>Language</h3>
      <button type="button" class="opt"><span style="width: 16px"></span>Off</button>
      <button type="button" class="opt focus"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>English</button>
      <button type="button" class="opt"><span style="width: 16px"></span>English (SDH)</button>
      <button type="button" class="opt"><span style="width: 16px"></span>Deutsch</button>
      <button type="button" class="opt"><span style="width: 16px"></span>Nederlands</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 16px">
      <div>
        <h3>Size</h3>
        <div class="step"><button type="button" aria-label="Smaller">−</button><span>Medium</span><button type="button" aria-label="Larger">+</button></div>
      </div>
      <div>
        <h3>Delay</h3>
        <div class="step"><button type="button" aria-label="Earlier">−</button><span>+0.3 s</span><button type="button" aria-label="Later">+</button></div>
      </div>
    </div>
  </section>

  <section style="position: absolute; left: 60px; right: 60px; bottom: 40px; display: flex; flex-direction: column; gap: 12px">
    <div style="font-size: 26px; font-weight: 700">Tears of Steel</div>
    <div style="position: relative; height: 8px; border-radius: 4px; background: rgba(255,255,255,.3); overflow: hidden" role="slider" aria-label="Playback position" aria-valuenow="34" aria-valuemin="0" aria-valuemax="100">
      <div style="position: absolute; left: 34%; top: 0; bottom: 0; width: 14%; background: rgba(255,255,255,.25)" aria-hidden="true"></div>
      <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 34%; background: #fff"></div>
    </div>
    <div class="sec" style="display: flex; justify-content: space-between; font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums">
      <span>4:12</span><span>−8:02</span>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
